<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Odszyfruj i przeczytaj dokument Markdown." />
    <title>Encrypted document</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script defer type="module" src="app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="document-card" aria-label="Przeglądarka zaszyfrowanych dokumentów">
        <header class="control-bar">
          <input id="decode-key" name="decode-key" type="text" autocomplete="off" placeholder="Klucz dekodowania" aria-label="Klucz dekodowania" />
          <input id="reserved-input" name="reserved-input" type="text" autocomplete="off" placeholder="Pole dodatkowe" aria-label="Pole dodatkowe" />
          <select id="reserved-number" name="reserved-number" aria-label="Liczba do późniejszego użycia">
            <option value="" selected disabled>Wybierz liczbę</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
          <p id="status" class="status" aria-live="polite">Dokument pozostaje zaszyfrowany.</p>
        </header>

        <div class="content-grid">
          <div class="document-frame" aria-label="Odszyfrowana zawartość dokumentu">
            <button id="explorer-trigger" class="explorer-trigger" type="button">Przeglądaj pliki</button>
            <article id="document-content" class="markdown-body" hidden></article>
            <p id="locked-message" class="locked-message">Wybierz plik i podaj klucz, aby zobaczyć zawartość.</p>
          </div>
        </div>
      </section>
    </main>

    <dialog id="file-dialog" class="file-dialog" aria-labelledby="explorer-title">
      <header class="dialog-header">
        <p id="explorer-title" class="explorer-label">PLIKI W REPOZYTORIUM</p>
        <form method="dialog"><button class="dialog-close" type="submit" aria-label="Zamknij okno">×</button></form>
      </header>
      <nav id="file-menu" class="file-menu" aria-label="Dokumenty do otwarcia">
        <p class="file-menu-status">Wczytywanie listy plików…</p>
      </nav>
    </dialog>
  </body>
</html>
